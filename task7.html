<!DOCTYPE html>
<html>
<head>
  <title>Products</title>
</head>
<body>

<h2>Products</h2>

<!-- ✅ Category Buttons -->
<button onclick="filterCategory('electronics')">Electronics</button>
<button onclick="filterCategory('jewelery')">Jewelery</button>
<button onclick="filterCategory('men\'s clothing')">Men</button>
<button onclick="filterCategory('women\'s clothing')">Women</button>
<button onclick="showAll()">All</button>

<br><br>

<div id="products"></div>

<script>

let container = document.getElementById("products");
let allProducts = [];

// ✅ Fetch API
fetch("https://fakestoreapi.com/products")
.then(res => res.json())
.then(data => {
  allProducts = data;
  displayProducts(data);
});

// ✅ Display function
function displayProducts(data) {
  container.innerHTML = "";

  data.forEach(product => {
    let div = document.createElement("div");

    div.innerHTML = `
      <img src="${product.image}" width="100"><br>
      ${product.title}<br>
      ₹${product.price}<br><br>
    `;

    container.appendChild(div);
  });
}

// ✅ Category filter
function filterCategory(category) {
  let filtered = allProducts.filter(p => p.category === category);
  displayProducts(filtered);
}

// ✅ Show all
function showAll() {
  displayProducts(allProducts);
}

</script>

</body>
</html>
